<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" style="background:#070913; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#140b29" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <radialGradient id="orbArch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGrad2)" />
  <rect width="1200" height="1200" fill="url(#grid2)" />
  <circle cx="600" cy="500" r="450" fill="url(#orbArch)" />

  <g transform="translate(600, 105)">
    <rect x="-240" y="-22" width="480" height="32" rx="16" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.5" />
    <text text-anchor="middle" y="-2" fill="#00f2fe" font-size="14" font-weight="800" letter-spacing="3">SYSTEM ARCHITECTURE &amp; PIPELINE</text>
    <text text-anchor="middle" y="52" fill="#ffffff" font-size="42" font-weight="900">How Memory Graph Works Under the Hood</text>
    <text text-anchor="middle" y="88" fill="#e2e8f0" font-size="19" font-weight="500">Zero-Backend, 100% Client-Side Knowledge Processing Engine</text>
  </g>

  <!-- PIPELINE STAGES VERTICAL FLOW -->
  <g transform="translate(200, 240)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="800" height="100" rx="14" fill="#11152d" stroke="#00f2fe" stroke-width="2.5" />
      <text x="40" y="58" fill="#00f2fe" font-size="30">📥</text>
      <text x="100" y="44" fill="#00f2fe" font-size="19" font-weight="800">1. INGESTION</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="14" font-weight="600">PDFs • GitHub Code • Team Chat • Emails • Voice Notes</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(0, 130)">
      <rect width="800" height="100" rx="14" fill="#11152d" stroke="#6366f1" stroke-width="2.5" />
      <text x="40" y="58" fill="#6366f1" font-size="30">⚙️</text>
      <text x="100" y="44" fill="#818cf8" font-size="19" font-weight="800">2. ENTITY PARSER</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="14" font-weight="600">Tokenizes text &amp; classifies 11 distinct entity categories</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(0, 260)">
      <rect width="800" height="100" rx="14" fill="#11152d" stroke="#a78bfa" stroke-width="2.5" />
      <text x="40" y="58" fill="#a78bfa" font-size="30">🧮</text>
      <text x="100" y="44" fill="#a78bfa" font-size="19" font-weight="800">3. TF-IDF VECTOR MATRIX</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="14" font-weight="600">In-memory frequency matrices &amp; Cosine distance similarity calculator</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(0, 390)">
      <rect width="800" height="100" rx="14" fill="#11152d" stroke="#ff007f" stroke-width="2.5" />
      <text x="40" y="58" fill="#ff007f" font-size="30">⚡</text>
      <text x="100" y="44" fill="#ff007f" font-size="19" font-weight="800">4. AUTO DISCOVERY</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="14" font-weight="600">Implicit relationship edge generator with confidence scoring</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(0, 520)">
      <rect width="800" height="100" rx="14" fill="#11152d" stroke="#00f5d4" stroke-width="2.5" />
      <text x="40" y="58" fill="#00f5d4" font-size="30">🖥️</text>
      <text x="100" y="44" fill="#00f5d4" font-size="19" font-weight="800">5. PRESENTATION</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="14" font-weight="600">Graph Explorer • RAG Search • Evolution Timeline • Analytics</text>
    </g>
  </g>

  <!-- CAPABILITIES -->
  <g transform="translate(100, 900)">
    <rect width="1000" height="160" rx="16" fill="#090d1f" stroke="#7928ca" stroke-width="2" />
    <text x="500" y="40" text-anchor="middle" fill="#00f5d4" font-size="18" font-weight="800">VERIFIED TECHNICAL CAPABILITIES</text>

    <text x="200" y="85" fill="#e2e8f0" font-size="15" font-weight="600">✔ Zero-Dependency In-Memory Vector Search</text>
    <text x="640" y="85" fill="#e2e8f0" font-size="15" font-weight="600">✔ BFS Shortest Pathfinder Algorithm</text>
    <text x="200" y="122" fill="#e2e8f0" font-size="15" font-weight="600">✔ Subgraph RAG Conversational Traversal</text>
    <text x="640" y="122" fill="#e2e8f0" font-size="15" font-weight="600">✔ Multi-Format Exporter (Neo4j &amp; Obsidian)</text>
  </g>
</svg>
