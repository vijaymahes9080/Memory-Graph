<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" width="1200" height="2400" style="background:#070913; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Rich Multi-Color Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="35%" stop-color="#0f1126" />
      <stop offset="70%" stop-color="#140b29" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Rainbow Text Gradient -->
    <linearGradient id="rainbowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#8a2be2" />
      <stop offset="70%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff8008" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="cyanNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <linearGradient id="magentaNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="emeraldNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00a86b" />
    </linearGradient>

    <linearGradient id="orangeNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8008" />
      <stop offset="100%" stop-color="#ffc837" />
    </linearGradient>

    <linearGradient id="purpleNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b829ea" />
      <stop offset="100%" stop-color="#5b00e2" />
    </linearGradient>

    <!-- Glowing Ambient Radial Orbs -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8008" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff8008" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Glow Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="2400" fill="url(#bgGrad)" />
  <rect width="1200" height="2400" fill="url(#grid)" />

  <!-- Vibrant Glow Orbs -->
  <circle cx="250" cy="250" r="350" fill="url(#orbCyan)" />
  <circle cx="950" cy="500" r="380" fill="url(#orbMagenta)" />
  <circle cx="300" cy="1100" r="400" fill="url(#orbPurple)" />
  <circle cx="900" cy="1650" r="350" fill="url(#orbGold)" />
  <circle cx="400" cy="2150" r="350" fill="url(#orbEmerald)" />

  <!-- HEADER SECTION -->
  <g transform="translate(600, 75)">
    <rect x="-240" y="-25" width="480" height="34" rx="17" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.5" />
    <text text-anchor="middle" y="-3" fill="#00f2fe" font-size="14" font-weight="800" letter-spacing="3">🧠 MEMORY GRAPH — AI INFRASTRUCTURE</text>

    <text text-anchor="middle" y="55" fill="url(#rainbowText)" font-size="44" font-weight="900">Don’t store information. Build relationships between it.</text>
    <text text-anchor="middle" y="95" fill="#e2e8f0" font-size="18" font-weight="500">100% Client-Side Operating System • TF-IDF Embeddings • Force-Directed Physics</text>

    <!-- Tech Badges Strip -->
    <g transform="translate(0, 135)">
      <rect x="-420" y="-18" width="130" height="32" rx="8" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.5" />
      <text x="-355" y="4" text-anchor="middle" fill="#00f2fe" font-size="13" font-weight="700">React 18.3</text>

      <rect x="-275" y="-18" width="145" height="32" rx="8" fill="#7928ca" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.5" />
      <text x="-202" y="4" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">TypeScript 5.7</text>

      <rect x="-115" y="-18" width="110" height="32" rx="8" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1.5" />
      <text x="-60" y="4" text-anchor="middle" fill="#ff007f" font-size="13" font-weight="700">Vite 6.1</text>

      <rect x="10" y="-18" width="140" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
      <text x="80" y="4" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">TailwindCSS</text>

      <rect x="165" y="-18" width="135" height="32" rx="8" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="1.5" />
      <text x="232" y="4" text-anchor="middle" fill="#00f5d4" font-size="13" font-weight="700">Canvas API</text>

      <rect x="315" y="-18" width="125" height="32" rx="8" fill="#ff8008" fill-opacity="0.2" stroke="#ff8008" stroke-width="1.5" />
      <text x="377" y="4" text-anchor="middle" fill="#ff8008" font-size="13" font-weight="700">TF-IDF Vector</text>
    </g>
  </g>

  <line x1="100" y1="245" x2="1100" y2="245" stroke="#7928ca" stroke-opacity="0.5" stroke-width="2" />

  <!-- SECTION 1: FORCE GRAPH UI -->
  <g transform="translate(100, 280)">
    <text x="0" y="0" fill="#00f2fe" font-size="26" font-weight="800">🕸️ SECTION 1 — Real-Time Force Graph Physics Canvas (200+ FPS)</text>

    <g transform="translate(0, 30)">
      <rect width="1000" height="530" rx="20" fill="#11152d" fill-opacity="0.9" stroke="#7928ca" stroke-opacity="0.6" stroke-width="2.5" />
      
      <!-- Top Title Bar -->
      <rect width="1000" height="50" rx="20" fill="#090d1f" fill-opacity="0.95" stroke="#1e2a4a" stroke-width="1" />
      <text x="25" y="31" fill="#00f2fe" font-size="14" font-weight="700">Interactive Canvas Explorer • Coulomb Repulsion &amp; Hooke Spring Attraction Engine</text>
      
      <circle cx="930" cy="25" r="7" fill="#ff007f" />
      <circle cx="955" cy="25" r="7" fill="#ffc837" />
      <circle cx="980" cy="25" r="7" fill="#00f5d4" />

      <!-- Glowing Connecting Edges -->
      <line x1="200" y1="180" x2="540" y2="160" stroke="#ff007f" stroke-width="3.5" filter="url(#neonGlow)" />
      <rect x="325" y="156" width="100" height="24" rx="6" fill="#11152d" stroke="#ff007f" stroke-width="1.5" />
      <text x="375" y="172" text-anchor="middle" fill="#ff007f" font-size="11" font-weight="800">⚡ IMPLEMENTS</text>

      <line x1="540" y1="160" x2="660" y2="390" stroke="#ff8008" stroke-width="3.5" filter="url(#neonGlow)" />
      <rect x="555" y="263" width="90" height="24" rx="6" fill="#11152d" stroke="#ff8008" stroke-width="1.5" />
      <text x="600" y="279" text-anchor="middle" fill="#ff8008" font-size="11" font-weight="800">⚡ EXTENDS</text>

      <line x1="200" y1="180" x2="300" y2="370" stroke="#00f2fe" stroke-width="3.5" filter="url(#neonGlow)" />
      <rect x="205" y="263" width="105" height="24" rx="6" fill="#11152d" stroke="#00f2fe" stroke-width="1.5" />
      <text x="257" y="279" text-anchor="middle" fill="#00f2fe" font-size="11" font-weight="800">⚡ DEPENDS_ON</text>

      <!-- Glowing Nodes -->
      <g transform="translate(200, 180)">
        <circle r="40" fill="url(#cyanNode)" filter="url(#neonGlow)" />
        <text text-anchor="middle" y="5" fill="#ffffff" font-size="15" font-weight="900">PDF</text>
        <text text-anchor="middle" y="62" fill="#00f2fe" font-size="13" font-weight="700">SAR Flood Spec.pdf</text>
      </g>

      <g transform="translate(540, 160)">
        <circle r="44" fill="url(#magentaNode)" filter="url(#neonGlow)" />
        <text text-anchor="middle" y="6" fill="#ffffff" font-size="15" font-weight="900">CODE</text>
        <text text-anchor="middle" y="66" fill="#ff007f" font-size="13" font-weight="700">Flood-Prediction-ML (Repo)</text>
      </g>

      <g transform="translate(810, 240)">
        <circle r="34" fill="url(#purpleNode)" filter="url(#neonGlow)" />
        <text text-anchor="middle" y="5" fill="#ffffff" font-size="13" font-weight="900">CHAT</text>
        <text text-anchor="middle" y="54" fill="#a78bfa" font-size="13" font-weight="700">Team Chat Decision</text>
      </g>

      <g transform="translate(300, 370)">
        <circle r="32" fill="url(#emeraldNode)" filter="url(#neonGlow)" />
        <text text-anchor="middle" y="5" fill="#ffffff" font-size="13" font-weight="900">DATA</text>
        <text text-anchor="middle" y="52" fill="#00f5d4" font-size="13" font-weight="700">Copernicus API (Data)</text>
      </g>

      <g transform="translate(660, 390)">
        <circle r="38" fill="url(#orangeNode)" filter="url(#neonGlow)" />
        <text text-anchor="middle" y="6" fill="#ffffff" font-size="14" font-weight="900">PAPER</text>
        <text text-anchor="middle" y="58" fill="#ffc837" font-size="13" font-weight="700">Crop Hydrology (Paper)</text>
      </g>

      <!-- Pathfinder Bottom Banner -->
      <g transform="translate(30, 465)">
        <rect width="940" height="44" rx="10" fill="#070913" stroke="#00f2fe" stroke-width="2" />
        <text x="470" y="28" text-anchor="middle" fill="#00f2fe" font-size="13" font-weight="800">⚡ BFS Shortest Path Discovered: SAR Flood Spec.pdf  ➔  Flood-Prediction-ML  ➔  Crop Hydrology Paper</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: MULTIMODAL AI PIPELINE -->
  <g transform="translate(100, 890)">
    <text x="0" y="0" fill="#ff007f" font-size="26" font-weight="800">⚙️ SECTION 2 — Multimodal AI Data Pipeline Architecture</text>

    <g transform="translate(0, 35)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="100" rx="14" fill="#11152d" stroke="#00f2fe" stroke-width="2" />
        <text x="90" y="38" text-anchor="middle" fill="#00f2fe" font-size="16" font-weight="800">1. INGEST</text>
        <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">PDFs, Code, Chat, Emails</text>
      </g>

      <!-- Stage 2 -->
      <g transform="translate(205, 0)">
        <rect width="180" height="100" rx="14" fill="#11152d" stroke="#6366f1" stroke-width="2" />
        <text x="90" y="38" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="800">2. PARSE</text>
        <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">11 Entity Types</text>
      </g>

      <!-- Stage 3 -->
      <g transform="translate(410, 0)">
        <rect width="180" height="100" rx="14" fill="#11152d" stroke="#a78bfa" stroke-width="2" />
        <text x="90" y="38" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="800">3. EMBED</text>
        <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">TF-IDF &amp; Cosine Engine</text>
      </g>

      <!-- Stage 4 -->
      <g transform="translate(615, 0)">
        <rect width="180" height="100" rx="14" fill="#11152d" stroke="#ff007f" stroke-width="2" />
        <text x="90" y="38" text-anchor="middle" fill="#ff007f" font-size="16" font-weight="800">4. DISCOVER</text>
        <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Implicit Edge Generator</text>
      </g>

      <!-- Stage 5 -->
      <g transform="translate(820, 0)">
        <rect width="180" height="100" rx="14" fill="#11152d" stroke="#00f5d4" stroke-width="2" />
        <text x="90" y="38" text-anchor="middle" fill="#00f5d4" font-size="16" font-weight="800">5. QUERY</text>
        <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">RAG Subgraph Traversal</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: FOUR INTERFACE VIEWPORTS -->
  <g transform="translate(100, 1075)">
    <text x="0" y="0" fill="#00f5d4" font-size="26" font-weight="800">🖥️ SECTION 3 — Four Core Application Viewports</text>

    <g transform="translate(0, 35)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="475" height="210" rx="16" fill="#11152d" stroke="#6366f1" stroke-width="2" />
        <rect width="475" height="6" rx="3" fill="#6366f1" />
        <text x="30" y="48" fill="#ffffff" font-size="20" font-weight="800">🔍 RAG AI Search Assistant</text>
        <text x="30" y="90" fill="#94a3b8" font-size="14">Answers complex natural language queries by traversing</text>
        <text x="30" y="115" fill="#94a3b8" font-size="14">connected subgraphs with verified citation badges.</text>
        <rect x="30" y="152" width="140" height="30" rx="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" />
        <text x="100" y="172" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="800">RAG ASSISTANT</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(525, 0)">
        <rect width="475" height="210" rx="16" fill="#11152d" stroke="#00f2fe" stroke-width="2" />
        <rect width="475" height="6" rx="3" fill="#00f2fe" />
        <text x="30" y="48" fill="#ffffff" font-size="20" font-weight="800">⏱️ Evolution Time Machine</text>
        <text x="30" y="90" fill="#94a3b8" font-size="14">Time-scrubbing animation tracking node and edge</text>
        <text x="30" y="115" fill="#94a3b8" font-size="14">emergence from Sep 2025 to Feb 2026.</text>
        <rect x="30" y="152" width="140" height="30" rx="8" fill="#00f2fe" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1.5" />
        <text x="100" y="172" text-anchor="middle" fill="#00f2fe" font-size="12" font-weight="800">TIMELINE MODULE</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 245)">
        <rect width="475" height="210" rx="16" fill="#11152d" stroke="#ff007f" stroke-width="2" />
        <rect width="475" height="6" rx="3" fill="#ff007f" />
        <text x="30" y="48" fill="#ffffff" font-size="20" font-weight="800">⚡ Auto Relationship Discovery</text>
        <text x="30" y="90" fill="#94a3b8" font-size="14">Live feed of AI-discovered implicit links, contradiction</text>
        <text x="30" y="115" fill="#94a3b8" font-size="14">alerts, and knowledge gap recommendations.</text>
        <rect x="30" y="152" width="140" height="30" rx="8" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1.5" />
        <text x="100" y="172" text-anchor="middle" fill="#ff007f" font-size="12" font-weight="800">DISCOVERY HUB</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(525, 245)">
        <rect width="475" height="210" rx="16" fill="#11152d" stroke="#00f5d4" stroke-width="2" />
        <rect width="475" height="6" rx="3" fill="#00f5d4" />
        <text x="30" y="48" fill="#ffffff" font-size="20" font-weight="800">📊 Graph Analytics Dashboard</text>
        <text x="30" y="90" fill="#94a3b8" font-size="14">Quantitative metrics on connectivity density, link ratios,</text>
        <text x="30" y="115" fill="#94a3b8" font-size="14">and entity distribution charts.</text>
        <rect x="30" y="152" width="140" height="30" rx="8" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="1.5" />
        <text x="100" y="172" text-anchor="middle" fill="#00f5d4" font-size="12" font-weight="800">ANALYTICS MODULE</text>
      </g>
    </g>
  </g>

  <!-- SECTION 4: ALGORITHMIC DEPTH -->
  <g transform="translate(100, 1600)">
    <text x="0" y="0" fill="#ff8008" font-size="26" font-weight="800">⚡ SECTION 4 — Verified Algorithmic Core</text>

    <g transform="translate(0, 35)">
      <g transform="translate(0, 0)">
        <rect width="475" height="125" rx="14" fill="#090d1f" stroke="#00f2fe" stroke-width="1.5" />
        <text x="25" y="42" fill="#00f2fe" font-size="17" font-weight="800">• TF-IDF Vector Embedding Engine</text>
        <text x="25" y="78" fill="#94a3b8" font-size="13">Tokenizes document titles, text, and metadata inside browser.</text>
      </g>

      <g transform="translate(525, 0)">
        <rect width="475" height="125" rx="14" fill="#090d1f" stroke="#ff007f" stroke-width="1.5" />
        <text x="25" y="42" fill="#ff007f" font-size="17" font-weight="800">• Cosine Distance Matrix Calculator</text>
        <text x="25" y="78" fill="#94a3b8" font-size="13">Evaluates similarity scores between all entity pairs.</text>
      </g>

      <g transform="translate(0, 150)">
        <rect width="475" height="125" rx="14" fill="#090d1f" stroke="#00f5d4" stroke-width="1.5" />
        <text x="25" y="42" fill="#00f5d4" font-size="17" font-weight="800">• BFS Shortest Pathfinder</text>
        <text x="25" y="78" fill="#94a3b8" font-size="13">Queue-based multi-hop graph traversal algorithm.</text>
      </g>

      <g transform="translate(525, 150)">
        <rect width="475" height="125" rx="14" fill="#090d1f" stroke="#ff8008" stroke-width="1.5" />
        <text x="25" y="42" fill="#ff8008" font-size="17" font-weight="800">• Multi-Format Data Exporter</text>
        <text x="25" y="78" fill="#94a3b8" font-size="13">Exports graph networks to JSON, Neo4j Cypher &amp; Obsidian.</text>
      </g>
    </g>
  </g>

  <!-- FOOTER CREDENTIALS SECTION -->
  <g transform="translate(100, 1930)">
    <rect width="1000" height="400" rx="20" fill="#11152d" fill-opacity="0.95" stroke="#7928ca" stroke-width="2.5" />
    <text x="500" y="65" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="900">Memory Graph — Don’t store information. Build relationships between it.</text>
    <text x="500" y="105" text-anchor="middle" fill="#94a3b8" font-size="16">A complete, production-ready AI knowledge operating system operating 100% inside your browser.</text>
    <text x="500" y="135" text-anchor="middle" fill="#00f5d4" font-size="15" font-weight="700">Zero server infrastructure • Zero external LLM API costs • Complete data privacy</text>

    <g transform="translate(150, 175)">
      <rect width="700" height="60" rx="12" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="2" />
      <text x="350" y="37" text-anchor="middle" fill="#818cf8" font-size="18" font-weight="800">🔗 GitHub: https://github.com/vijaymahes9080/Memory-Graph.git</text>
    </g>

    <text x="500" y="285" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Author: Vijay Mahes</text>
    <text x="500" y="318" text-anchor="middle" fill="#94a3b8" font-size="14">Email: Vijaypradhap2004@gmail.com  •  License: MIT  •  Version: v2.4 AI-Core</text>
  </g>
</svg>
